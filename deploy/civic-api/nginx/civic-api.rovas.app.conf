server {
    listen 80;
    server_name civic-api.rovas.app;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name civic-api.rovas.app;

    ssl_certificate /etc/letsencrypt/live/civic-api.rovas.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/civic-api.rovas.app/privkey.pem;

    client_max_body_size 8M;

    location / {
        proxy_pass http://172.18.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

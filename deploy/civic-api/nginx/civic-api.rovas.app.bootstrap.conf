# HTTP-only bootstrap for first certbot issuance (before TLS files exist).
server {
    listen 80;
    server_name civic-api.rovas.app;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 200 'civic-api cert bootstrap\n';
        add_header Content-Type text/plain;
    }
}
